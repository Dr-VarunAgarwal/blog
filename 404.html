<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — lucidité</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f1e7d2">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,480;1,9..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f1e7d2; --text:#2a241c; --muted:rgba(42,36,28,0.55);
    --rule:rgba(42,36,28,0.2); --accent:#7b3131; --blue:#3f7286;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--paper); color:var(--text);
    font-family:"Space Mono", monospace;
    min-height:100vh; display:flex; flex-direction:column;
  }
  header{ max-width:760px; width:100%; margin:0 auto; padding:1.1rem 1.5rem 0.9rem; border-bottom:1px solid var(--rule); }
  .wordmark{ font-family:"Fraunces", serif; font-weight:480; font-size:1.15rem; color:inherit; text-decoration:none; }
  main{ max-width:760px; width:100%; margin:0 auto; padding:18vh 1.5rem 4rem; flex:1; }
  h1{
    font-family:"Fraunces", serif; font-weight:480; font-style:italic;
    font-size:clamp(4rem, 20vw, 7rem); line-height:0.9; margin:0 0 1.5rem; color:var(--blue);
  }
  p{ font-size:0.9rem; line-height:1.7; color:var(--muted); margin:0 0 2rem; max-width:44ch; }
  nav{ display:flex; flex-wrap:wrap; gap:0.75rem 1.75rem; }
  nav a{
    color:var(--text); text-decoration:none; font-size:0.78rem; letter-spacing:0.05em; text-transform:uppercase;
    border-bottom:1px solid var(--rule); padding-bottom:0.15rem;
  }
  nav a:hover{ color:var(--accent); border-bottom-color:var(--accent); }
</style>
</head>
<body>
<header><a class="wordmark" href="https://blog.varunagarwal.com/">lucidité</a></header>
<main>
  <h1>404</h1>
  <p>There's no page at this address.</p>
  <nav>
    <a id="search-link" href="https://blog.varunagarwal.com/" hidden></a>
    <a href="https://blog.varunagarwal.com/">Home</a>
  </nav>
</main>
<script>
  // turn the missing path into a search on the hub, e.g. /vanila → "vanila"
  const seg = decodeURIComponent(location.pathname).split('/').filter(Boolean).pop() || '';
  const term = seg.replace(/\.html?$/, '').replace(/[-_+]+/g, ' ').trim();
  if (term) {
    const a = document.getElementById('search-link');
    a.href = 'https://blog.varunagarwal.com/?q=' + encodeURIComponent(term);
    a.textContent = 'Search for “' + term + '”';
    a.hidden = false;
  }
</script>
</body>
</html>
