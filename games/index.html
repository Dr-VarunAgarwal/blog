<link rel="icon" type="image/png" sizes="192x192" href="../favicon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<!--
  GAMES — blog.varunagarwal.com/games/. A tier list (S → F, left is stronger
  within a row), after the FindMeNext ad Varun screenshotted (2026-10-03).
  Plain HTML/CSS/JS, no build step, no dependencies.

  PUBLISHED vs DRAFT
  The public page only ever reads games.json (next to this file) — nobody
  else can change it. Editing is switched on by opening /games/?edit (bookmark
  that on the phone). Edits are autosaved as a DRAFT in this browser's
  localStorage only. To publish: "Copy JSON" → paste into games.json → commit.
  Covers picked from the photo library are shrunk to ~180×240 and travel
  inside that JSON as data: URIs; they can be split out into games/img/ files
  later (a cover may be any URL or relative path, e.g. "img/hades.jpg").

  games.json shape:
    { "intro": "…", "tiers": { "S": ["id", …], "A": [], … "F": [] },
      "pool": ["id", …],                        // added but not yet ranked
      "games": { "id": { "title": "", "note": "", "cover": "" } } }
  Pool games are only shown in edit mode.

  Layout in edit mode: add form and the Unranked tray sit ABOVE the board so
  a phone user never has to scroll mid-drag; rows keep a fixed minimum height
  so nothing reflows under the finger while dragging.

  DRAG: pointer events, so it works on touch. Mouse drags after 4px; touch
  needs a short press-and-hold (so scrolling the page still works). Tapping a
  tile opens its sheet, which also has buttons to move it to a tier, as a
  non-drag fallback.
-->

<style>
  :root{
    --ink:#1b2119; --paper:#f1e7d2; --paper-soft:#e6d9bd; --gold:#c29a4b;
    --oxblood:#7b3131; --forest:#2f4a3a; --clay:#b5572e;
    --text:#2a241c; --muted:rgba(42,36,28,0.55); --rule:rgba(42,36,28,0.16);
    --rule-strong:rgba(42,36,28,0.28);
    --max:760px; --tile-w:64px; --tile-h:86px;
  }
  @media(min-width:640px){ :root{ --tile-w:76px; --tile-h:102px; } }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--paper); color:var(--text); font-family:"Space Mono",monospace; min-height:100vh; }
  a{ color:inherit; }

  header.site-header{
    max-width:var(--max); margin:0 auto; padding:1.1rem 1.5rem 0.9rem;
    border-bottom:1px solid var(--rule); display:flex; align-items:baseline; justify-content:space-between; gap:1rem;
  }
  .wordmark{ font-family:"Fraunces",serif; font-weight:480; font-size:1.15rem; letter-spacing:-0.01em; text-decoration:none; }
  .crumb{ font-size:0.62rem; letter-spacing:0.06em; text-transform:uppercase; color:var(--muted); text-decoration:none; }
  .crumb:hover{ color:var(--oxblood); }

  main{ max-width:var(--max); margin:0 auto; padding:1.75rem 1.5rem 3rem; }
  h1{ font-family:"Fraunces",serif; font-weight:480; font-size:clamp(2rem,7vw,3rem); letter-spacing:-0.02em; margin:0 0 0.35rem; line-height:1.05; }
  h1 em{ font-style:italic; color:var(--oxblood); }
  .intro{ margin:0 0 1.5rem; font-size:0.78rem; line-height:1.6; color:var(--muted); }

  /* ---------- the board ---------- */
  .board{ border:1px solid var(--rule-strong); background:var(--paper-soft); }
  .tier{ display:flex; border-bottom:1px solid var(--rule-strong); min-height:calc(var(--tile-h) + 10px); }
  .tier:last-child{ border-bottom:0; }
  .tier-label{
    flex:0 0 clamp(44px,12vw,64px); display:flex; align-items:center; justify-content:center;
    font-family:"Fraunces",serif; font-weight:600; font-size:clamp(1.5rem,6vw,2rem);
    border-right:1px solid var(--rule-strong);
  }
  .tiles{ flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:5px; padding:5px; align-content:flex-start; }
  .editing .tiles, .pool .tiles{ min-height:calc(var(--tile-h) + 10px); }   /* fixed so rows don't jump under the finger mid-drag */
  .editing .tier .tiles:empty::before, .pool .tiles:empty::before{
    content:attr(data-hint); align-self:center; margin:0 0.5rem; font-size:0.62rem; letter-spacing:0.05em;
    text-transform:uppercase; color:var(--muted);
  }
  .tiles.over{ background:rgba(194,154,75,0.22); }

  .tile{
    position:relative; width:var(--tile-w); height:var(--tile-h); flex:0 0 auto; overflow:hidden;
    background-color:var(--tc,#555); background-size:cover; background-position:center;
    border:1px solid rgba(27,33,25,0.35); cursor:pointer;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  }
  .editing .tile{ cursor:grab; }
  .tile:focus-visible{ outline:2px solid var(--oxblood); outline-offset:1px; }
  .tile .t{
    position:absolute; inset:0; padding:5px; display:flex; align-items:flex-end;
    font-family:"Fraunces",serif; font-weight:600; font-size:0.68rem; line-height:1.12; color:#f1e7d2;
    text-shadow:0 1px 2px rgba(0,0,0,0.5); overflow:hidden; word-break:break-word;
  }
  .tile.has-cover .t{ display:none; }
  .tile.dragging{ opacity:0.3; }
  .ghost{ position:fixed; z-index:50; pointer-events:none; opacity:0.92; box-shadow:0 8px 18px rgba(0,0,0,0.35); transform:rotate(3deg) scale(1.08); }

  .empty{ padding:2.5rem 1rem; text-align:center; font-size:0.78rem; color:var(--muted); border:1px dashed var(--rule-strong); }

  /* ---------- edit tools ---------- */
  .tools{ margin:0 0 1rem; }
  #exportWrap{ margin:1.25rem 0 0; }
  .pool{ margin:0 0 1rem; }
  .pool h2, .tools h2{ font-family:"Space Mono",monospace; font-size:0.62rem; letter-spacing:0.08em; text-transform:uppercase; font-weight:400; color:var(--muted); margin:0 0 0.4rem; }
  .pool .tiles{ border:1px dashed var(--rule-strong); }
  .add{ display:flex; flex-wrap:wrap; gap:0.5rem; align-items:center; }
  input[type=text], textarea{
    font:inherit; font-size:16px; /* 16px stops iOS zooming on focus */ color:var(--text);
    background:var(--paper); border:1px solid var(--rule-strong); border-radius:0; padding:0.5rem 0.6rem; min-width:0;
  }
  .add input[type=text]{ flex:1 1 180px; }
  textarea{ width:100%; min-height:4.5rem; resize:vertical; }
  button, .btn{
    font:inherit; font-size:0.72rem; letter-spacing:0.04em; color:var(--text); background:transparent;
    border:1px solid var(--rule-strong); padding:0.5rem 0.8rem; cursor:pointer; border-radius:0;
  }
  button:hover, .btn:hover{ border-color:var(--oxblood); color:var(--oxblood); }
  button.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  button.primary:hover{ background:var(--oxblood); border-color:var(--oxblood); color:var(--paper); }
  button.danger:hover{ background:var(--oxblood); color:var(--paper); }
  .row-actions{ display:flex; flex-wrap:wrap; gap:0.5rem; margin-top:0.75rem; }
  .status{ font-size:0.62rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); margin:0.5rem 0 0; }
  .status:empty{ display:none; }
  .status b{ color:var(--oxblood); font-weight:700; }

  footer{ max-width:var(--max); margin:0 auto; padding:1rem 1.5rem 2rem; border-top:1px solid var(--rule); font-size:0.62rem; letter-spacing:0.05em; text-transform:uppercase; color:var(--muted); display:flex; justify-content:space-between; gap:1rem; flex-wrap:wrap; }
  footer a{ text-decoration:none; }
  footer a:hover{ color:var(--oxblood); }

  /* ---------- sheet (dialog) ---------- */
  dialog{
    border:1px solid var(--rule-strong); background:var(--paper); color:var(--text); padding:0;
    width:min(440px,calc(100vw - 2rem)); max-height:calc(100vh - 2rem); overflow:auto;
  }
  dialog::backdrop{ background:rgba(27,33,25,0.5); }
  .sheet{ padding:1.1rem; }
  .sheet-top{ display:flex; gap:0.9rem; align-items:flex-start; }
  .sheet .tile{ flex:0 0 auto; cursor:default; }
  .sheet h3{ font-family:"Fraunces",serif; font-weight:480; font-size:1.35rem; margin:0 0 0.25rem; line-height:1.15; letter-spacing:-0.01em; }
  .sheet .tier-chip{ font-size:0.62rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); }
  .sheet .note{ margin:1rem 0 0; font-size:0.8rem; line-height:1.65; white-space:pre-wrap; }
  .sheet label{ display:block; margin-top:0.9rem; font-size:0.62rem; letter-spacing:0.07em; text-transform:uppercase; color:var(--muted); }
  .sheet label + input, .sheet label + textarea{ margin-top:0.3rem; width:100%; }
  .movers{ display:flex; flex-wrap:wrap; gap:0.35rem; margin-top:0.3rem; }
  .movers button{ min-width:2.4rem; padding:0.45rem 0.55rem; }
  .movers button[aria-pressed=true]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
</style>
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="../">lucidité</a>
  <a class="crumb" href="../">← Home</a>
</header>

<main id="main">
  <h1>Games<em>.</em></h1>
  <p class="intro" id="intro">Left is stronger.</p>

  <section class="tools" id="addWrap" hidden>
    <form class="add" id="addForm" autocomplete="off">
      <input type="text" id="addTitle" placeholder="Add a game…" maxlength="80" required aria-label="Game title">
      <label class="btn" for="addCover">Cover…</label>
      <input class="sr" type="file" id="addCover" accept="image/*">
      <button class="primary" type="submit">Add</button>
    </form>
    <p class="status" id="addCoverName"></p>
  </section>

  <section class="pool" id="poolWrap" hidden>
    <h2>Unranked — drag into a tier</h2>
    <div class="tiles drop" id="pool" data-hint="Add a game above"></div>
  </section>

  <div id="board" class="board" role="list" aria-label="Games ranked by tier"></div>
  <div id="empty" class="empty" hidden>Nothing ranked yet.</div>

  <section class="tools" id="exportWrap" hidden>
    <div class="row-actions">
      <button type="button" id="saveImg">Save as image</button>
      <button type="button" id="copyJson">Copy JSON</button>
      <button type="button" id="dlJson">Download JSON</button>
      <button type="button" id="discard" class="danger">Discard draft</button>
    </div>
    <p class="status" id="status"></p>
  </section>
</main>

<footer>
  <span id="count"></span>
  <a href="../">lucidité</a>
</footer>

<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>

<script>
(function(){
  'use strict';

  const TIERS = [
    { id:'S', bg:'#8f3232', fg:'#f1e7d2' },
    { id:'A', bg:'#b5572e', fg:'#f1e7d2' },
    { id:'B', bg:'#c29a4b', fg:'#1b2119' },
    { id:'C', bg:'#7d9461', fg:'#1b2119' },
    { id:'D', bg:'#3f7286', fg:'#f1e7d2' },
    { id:'F', bg:'#4a4540', fg:'#f1e7d2' }
  ];
  const DRAFT_KEY = 'games.draft.v1';
  const EDIT = /[?&]edit(=|&|$)/.test(location.search) || safe(() => localStorage.getItem('games.edit') === '1');
  if (/[?&]edit(=|&|$)/.test(location.search)) safe(() => localStorage.setItem('games.edit', '1'));

  const $ = id => document.getElementById(id);
  const board = $('board'), pool = $('pool'), sheet = $('sheet'), sheetBody = $('sheetBody');
  let data = blank();
  let published = blank();

  function safe(fn, fallback){ try { return fn(); } catch(e){ return fallback; } }
  function blank(){
    const tiers = {}; TIERS.forEach(t => tiers[t.id] = []);
    return { intro:'Left is stronger.', tiers, pool:[], games:{} };
  }
  function normalise(raw){
    const d = blank();
    if (!raw || typeof raw !== 'object') return d;
    if (typeof raw.intro === 'string') d.intro = raw.intro;
    d.games = raw.games && typeof raw.games === 'object' ? raw.games : {};
    const seen = new Set();
    const take = list => (Array.isArray(list) ? list : []).filter(id => d.games[id] && !seen.has(id) && seen.add(id));
    TIERS.forEach(t => d.tiers[t.id] = take(raw.tiers && raw.tiers[t.id]));
    d.pool = take(raw.pool);
    Object.keys(d.games).forEach(id => { if (!seen.has(id)) d.pool.push(id); });
    return d;
  }
  const serialise = d => JSON.stringify(d, null, 2) + '\n';
  const tierOf = id => (TIERS.find(t => data.tiers[t.id].includes(id)) || {}).id || null;

  // ---------- tile ----------
  function hue(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
  function makeTile(id){
    const g = data.games[id];
    const el = document.createElement('div');
    el.className = 'tile'; el.dataset.id = id; el.setAttribute('role', 'listitem');
    el.tabIndex = 0; el.setAttribute('aria-label', g.title);
    if (g.cover) { el.classList.add('has-cover'); el.style.backgroundImage = 'url(' + JSON.stringify(g.cover) + ')'; }
    else el.style.setProperty('--tc', 'hsl(' + hue(g.title) + ',32%,34%)');
    const t = document.createElement('span'); t.className = 't'; t.textContent = g.title; el.appendChild(t);
    return el;
  }

  // ---------- render ----------
  function render(){
    document.body.classList.toggle('editing', EDIT);
    $('intro').textContent = data.intro || '';
    board.textContent = '';
    const ranked = TIERS.reduce((n, t) => n + data.tiers[t.id].length, 0);
    TIERS.forEach(t => {
      if (!EDIT && !data.tiers[t.id].length) return;
      const row = document.createElement('div'); row.className = 'tier';
      const lab = document.createElement('div'); lab.className = 'tier-label'; lab.textContent = t.id;
      lab.style.background = t.bg; lab.style.color = t.fg;
      const box = document.createElement('div'); box.className = 'tiles drop'; box.dataset.tier = t.id;
      box.dataset.hint = 'Drop here';
      data.tiers[t.id].forEach(id => box.appendChild(makeTile(id)));
      row.append(lab, box); board.appendChild(row);
    });
    board.hidden = !EDIT && !ranked;
    $('empty').hidden = EDIT || ranked > 0;
    $('poolWrap').hidden = !EDIT; $('addWrap').hidden = !EDIT; $('exportWrap').hidden = !EDIT;
    pool.textContent = ''; data.pool.forEach(id => pool.appendChild(makeTile(id)));
    const n = ranked + (EDIT ? data.pool.length : 0);
    $('count').textContent = n ? n + (n === 1 ? ' game' : ' games') : '';
    if (EDIT) updateStatus();
  }

  // ---------- persistence (edit mode) ----------
  function commit(){
    const key = serialise(data);
    safe(() => {
      if (key === serialise(published)) localStorage.removeItem(DRAFT_KEY);
      else localStorage.setItem(DRAFT_KEY, key);
    }, null);
    updateStatus();
  }
  function updateStatus(){
    const dirty = serialise(data) !== serialise(published);
    $('status').innerHTML = dirty
      ? '<b>Draft</b> — saved in this browser only. Copy JSON into games.json to publish.'
      : 'Matches the published list.';
  }

  // ---------- dragging ----------
  let drag = null, suppressClick = false;
  const HOLD_MS = 220;

  board.addEventListener('pointerdown', onDown);
  pool.addEventListener('pointerdown', onDown);
  document.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive:false });
  document.addEventListener('contextmenu', e => { if (EDIT && e.target.closest('.tile')) e.preventDefault(); });

  function onDown(e){
    if (!EDIT || e.button > 0) return;
    const tile = e.target.closest('.tile'); if (!tile) return;
    drag = { tile, id:tile.dataset.id, x0:e.clientX, y0:e.clientY, x:e.clientX, y:e.clientY, pid:e.pointerId,
             touch: e.pointerType !== 'mouse', active:false, timer:null, ghost:null, raf:0 };
    if (drag.touch) drag.timer = setTimeout(start, HOLD_MS);
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  }
  function onMove(e){
    if (!drag || e.pointerId !== drag.pid) return;
    drag.x = e.clientX; drag.y = e.clientY;
    const moved = Math.hypot(drag.x - drag.x0, drag.y - drag.y0);
    if (!drag.active) {
      if (drag.touch) { if (moved > 8) cleanup(); return; }   // finger moved first: it's a scroll
      if (moved > 4) start(); else return;
    }
    e.preventDefault(); place();
  }
  function start(){
    if (!drag) return;
    clearTimeout(drag.timer); drag.active = true;
    const r = drag.tile.getBoundingClientRect();
    drag.dx = drag.x0 - r.left; drag.dy = drag.y0 - r.top;
    const g = drag.tile.cloneNode(true); g.className += ' ghost';
    g.style.width = r.width + 'px'; g.style.height = r.height + 'px';
    document.body.appendChild(g); drag.ghost = g;
    drag.tile.classList.add('dragging');
    pool.style.minHeight = pool.offsetHeight + 'px';   // tray must not shrink as tiles leave it
    if (navigator.vibrate) navigator.vibrate(8);
    place(); loop();
  }
  function place(){
    const g = drag.ghost;
    g.style.left = (drag.x - drag.dx) + 'px'; g.style.top = (drag.y - drag.dy) + 'px';
    document.querySelectorAll('.tiles.over').forEach(n => n.classList.remove('over'));
    const hit = document.elementFromPoint(drag.x, drag.y);
    const box = hit && hit.closest('.drop');
    if (!box) return;
    box.classList.add('over');
    let before = null;
    for (const c of box.children) {
      if (c === drag.tile) continue;
      const r = c.getBoundingClientRect();
      if (drag.y < r.top || (drag.y <= r.bottom && drag.x < r.left + r.width / 2)) { before = c; break; }
    }
    if (before !== drag.tile.nextSibling || drag.tile.parentNode !== box) box.insertBefore(drag.tile, before);
  }
  function loop(){            // edge auto-scroll while dragging
    if (!drag || !drag.active) return;
    const edge = 70, h = window.innerHeight;
    if (drag.y < edge) window.scrollBy(0, -Math.ceil((edge - drag.y) / 5));
    else if (drag.y > h - edge) window.scrollBy(0, Math.ceil((drag.y - (h - edge)) / 5));
    drag.raf = requestAnimationFrame(loop);
  }
  function onUp(e){
    if (!drag || (e.pointerId !== drag.pid)) return;
    const was = drag.active;
    if (was) {
      suppressClick = true; setTimeout(() => suppressClick = false, 0);
      TIERS.forEach(t => data.tiers[t.id] = ids(board.querySelector('[data-tier="' + t.id + '"]')));
      data.pool = ids(pool);
      cleanup(); commit(); render();
    } else cleanup();
  }
  const ids = box => box ? Array.from(box.children).filter(c => c.dataset.id).map(c => c.dataset.id) : [];
  function cleanup(){
    if (!drag) return;
    clearTimeout(drag.timer); cancelAnimationFrame(drag.raf);
    if (drag.ghost) drag.ghost.remove();
    drag.tile.classList.remove('dragging'); pool.style.minHeight = '';
    document.querySelectorAll('.tiles.over').forEach(n => n.classList.remove('over'));
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);
    drag = null;
  }

  // ---------- sheet ----------
  function openSheet(id){
    const g = data.games[id]; if (!g) return;
    const here = tierOf(id);
    sheetBody.textContent = '';
    const top = document.createElement('div'); top.className = 'sheet-top';
    top.appendChild(makeTile(id));
    const head = document.createElement('div'); head.style.minWidth = '0';
    const h = document.createElement('h3'); h.textContent = g.title;
    const chip = document.createElement('div'); chip.className = 'tier-chip';
    chip.textContent = here ? 'Tier ' + here : 'Unranked';
    head.append(h, chip); top.appendChild(head); sheetBody.appendChild(top);

    if (!EDIT) {
      if (g.note) { const p = document.createElement('p'); p.className = 'note'; p.textContent = g.note; sheetBody.appendChild(p); }
      const row = rowActions(); row.appendChild(btn('Close', () => sheet.close())); sheetBody.appendChild(row);
    } else {
      sheetBody.appendChild(field('Title', 'input', g.title, v => { g.title = v.trim() || g.title; }, 80));
      sheetBody.appendChild(field('Note — why it landed here (optional)', 'textarea', g.note || '', v => { g.note = v.trim(); }));
      const lab = document.createElement('label'); lab.textContent = 'Move to';
      const mv = document.createElement('div'); mv.className = 'movers';
      TIERS.concat([{ id:'' }]).forEach(t => {
        const b = btn(t.id || 'Unranked', () => { moveTo(id, t.id); sheet.close(); });
        b.setAttribute('aria-pressed', String((here || '') === t.id)); mv.appendChild(b);
      });
      sheetBody.append(lab, mv);
      const cv = document.createElement('input'); cv.type = 'file'; cv.accept = 'image/*'; cv.className = 'sr'; cv.id = 'sheetCover';
      cv.addEventListener('change', async () => {
        if (!cv.files[0]) return;
        g.cover = await shrink(cv.files[0]); commit(); render(); openSheet(id);
      });
      const cl = document.createElement('label'); cl.className = 'btn'; cl.htmlFor = 'sheetCover'; cl.textContent = g.cover ? 'Change cover…' : 'Add cover…';
      cl.style.display = 'inline-block'; cl.style.marginTop = '0.9rem';
      sheetBody.append(cv, cl);
      const row = rowActions();
      row.appendChild(btn('Save', () => { commit(); render(); sheet.close(); }, 'primary'));
      row.appendChild(btn('Remove', () => {
        if (!confirm('Remove “' + g.title + '”?')) return;
        TIERS.forEach(t => data.tiers[t.id] = data.tiers[t.id].filter(x => x !== id));
        data.pool = data.pool.filter(x => x !== id); delete data.games[id];
        commit(); render(); sheet.close();
      }, 'danger'));
      sheetBody.appendChild(row);
    }
    sheet.showModal();
  }
  function rowActions(){ const r = document.createElement('div'); r.className = 'row-actions'; return r; }
  function btn(text, fn, cls){ const b = document.createElement('button'); b.type = 'button'; b.textContent = text; if (cls) b.className = cls; b.addEventListener('click', fn); return b; }
  function field(label, kind, value, set, max){
    const wrap = document.createDocumentFragment();
    const l = document.createElement('label'); l.textContent = label;
    const i = kind === 'textarea' ? document.createElement('textarea') : Object.assign(document.createElement('input'), { type:'text' });
    if (max) i.maxLength = max; i.value = value; i.addEventListener('input', () => set(i.value));
    wrap.append(l, i); return wrap;
  }
  function moveTo(id, tier){
    TIERS.forEach(t => data.tiers[t.id] = data.tiers[t.id].filter(x => x !== id));
    data.pool = data.pool.filter(x => x !== id);
    (tier ? data.tiers[tier] : data.pool).push(id);
    commit(); render();
  }
  document.addEventListener('click', e => {
    const tile = e.target.closest('.board .tile, #pool .tile');
    if (tile && !suppressClick) openSheet(tile.dataset.id);
    if (e.target === sheet) sheet.close();          // backdrop tap
  });
  document.addEventListener('keydown', e => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('tile') && e.target.closest('.board, #pool')) {
      e.preventDefault(); openSheet(e.target.dataset.id);
    }
  });

  // ---------- covers: shrink to 180x240 JPEG (cover-crop) ----------
  function shrink(file){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const W = 180, H = 240, c = document.createElement('canvas'); c.width = W; c.height = H;
        const s = Math.max(W / img.width, H / img.height), w = img.width * s, h = img.height * s;
        c.getContext('2d').drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('not an image')); };
      img.src = url;
    });
  }

  // ---------- add form ----------
  let pendingCover = '';
  $('addCover').addEventListener('change', async e => {
    const f = e.target.files[0];
    try { pendingCover = f ? await shrink(f) : ''; $('addCoverName').textContent = f ? 'Cover: ' + f.name : ''; }
    catch(err){ pendingCover = ''; $('addCoverName').textContent = 'That file is not an image.'; }
  });
  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('addTitle').value.trim(); if (!title) return;
    const id = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    data.games[id] = { title, note:'', cover:pendingCover };
    data.pool.push(id);
    pendingCover = ''; $('addTitle').value = ''; $('addCover').value = ''; $('addCoverName').textContent = '';
    commit(); render(); $('addTitle').focus();
  });

  // ---------- export ----------
  function flash(msg){ const s = $('status'); s.textContent = msg; setTimeout(updateStatus, 2200); }
  $('copyJson').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(serialise(data)); flash('Copied games.json to the clipboard.'); }
    catch(e){ flash('Clipboard blocked — use Download JSON instead.'); }
  });
  $('dlJson').addEventListener('click', () => download(new Blob([serialise(data)], { type:'application/json' }), 'games.json'));
  $('discard').addEventListener('click', () => {
    if (!confirm('Throw away the draft and go back to the published list?')) return;
    safe(() => localStorage.removeItem(DRAFT_KEY)); data = normalise(JSON.parse(serialise(published))); render();
  });
  function download(blob, name){
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }

  // Save as image — draws the board onto a canvas (works with the page's own covers)
  $('saveImg').addEventListener('click', async () => {
    try { await document.fonts.ready; } catch(e){}
    const W = 1000, LAB = 90, T = 6, TW = 96, TH = 128, PAD = 8, perRow = Math.floor((W - LAB - PAD) / (TW + T));
    const rows = TIERS.filter(t => data.tiers[t.id].length);
    if (!rows.length) { flash('Rank something first.'); return; }
    const heights = rows.map(t => Math.max(1, Math.ceil(data.tiers[t.id].length / perRow)) * (TH + T) + PAD * 2 - T);
    const HEAD = 96, FOOT = 44, H = HEAD + heights.reduce((a, b) => a + b, 0) + FOOT;
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const x = c.getContext('2d');
    x.fillStyle = '#f1e7d2'; x.fillRect(0, 0, W, H);
    x.fillStyle = '#2a241c'; x.font = '500 46px Fraunces, Georgia, serif'; x.textBaseline = 'alphabetic';
    x.fillText('Games', 24, 64); const gw = x.measureText('Games').width;
    x.fillStyle = '#7b3131'; x.fillText('.', 24 + gw, 64);
    let y = HEAD;
    const imgs = {};
    await Promise.all(Object.keys(data.games).filter(id => data.games[id].cover).map(id => new Promise(res => {
      const im = new Image(); im.onload = () => { imgs[id] = im; res(); }; im.onerror = res; im.src = data.games[id].cover;
    })));
    rows.forEach((t, i) => {
      const h = heights[i];
      x.fillStyle = '#e6d9bd'; x.fillRect(0, y, W, h);
      x.fillStyle = t.bg; x.fillRect(0, y, LAB, h);
      x.fillStyle = t.fg; x.font = '600 54px Fraunces, Georgia, serif'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText(t.id, LAB / 2, y + h / 2); x.textAlign = 'left';
      data.tiers[t.id].forEach((id, n) => {
        const tx = LAB + PAD + (n % perRow) * (TW + T), ty = y + PAD + Math.floor(n / perRow) * (TH + T);
        if (imgs[id]) x.drawImage(imgs[id], tx, ty, TW, TH);
        else {
          x.fillStyle = 'hsl(' + hue(data.games[id].title) + ',32%,34%)'; x.fillRect(tx, ty, TW, TH);
          x.fillStyle = '#f1e7d2'; x.font = '600 14px Fraunces, Georgia, serif'; x.textBaseline = 'alphabetic';
          wrap(x, data.games[id].title, tx + 6, ty + TH - 6, TW - 12, 16);
        }
        x.strokeStyle = 'rgba(27,33,25,0.35)'; x.strokeRect(tx + .5, ty + .5, TW - 1, TH - 1);
      });
      y += h;
    });
    x.fillStyle = 'rgba(42,36,28,0.55)'; x.font = '400 15px "Space Mono", monospace'; x.textBaseline = 'middle';
    x.fillText('blog.varunagarwal.com/games', 24, H - FOOT / 2);
    c.toBlob(async blob => {
      const file = new File([blob], 'games-tier-list.png', { type:'image/png' });
      if (navigator.canShare && navigator.canShare({ files:[file] })) { try { await navigator.share({ files:[file] }); return; } catch(e){ if (e.name === 'AbortError') return; } }
      download(blob, 'games-tier-list.png');
    }, 'image/png');
  });
  function wrap(x, text, px, bottom, maxW, lh){        // bottom-anchored word wrap
    const lines = []; let line = '';
    text.split(/\s+/).forEach(w => {
      const t = line ? line + ' ' + w : w;
      if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
    });
    lines.push(line);
    lines.slice(-6).forEach((l, i, a) => x.fillText(l, px, bottom - (a.length - 1 - i) * lh));
  }

  // ---------- boot ----------
  fetch('games.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null).then(j => {
    published = normalise(j);
    data = published;
    if (EDIT) {
      const draft = safe(() => localStorage.getItem(DRAFT_KEY));
      if (draft) data = normalise(safe(() => JSON.parse(draft), null));
      else data = normalise(JSON.parse(serialise(published)));
    }
    render();
  });
})();
</script>
</body>
</html>
