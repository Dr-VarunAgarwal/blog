# Keeps the hub's "Recently filed" list, search index and RSS feed current.
# Clones the sibling site repos beside this one (the layout build-index.mjs
# expects), regenerates filed.json + feed.xml, and commits if they changed.
name: Refresh Recently filed
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-filed
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: blog
          fetch-depth: 0
      - name: Clone sibling repos
        run: |
          git clone https://github.com/Dr-VarunAgarwal/books.git books
          git clone https://github.com/Dr-VarunAgarwal/notes.git notes
          mkdir wander && git clone https://github.com/Dr-VarunAgarwal/field-notes.git wander/field-notes
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild
        working-directory: blog
        run: node tools/build-index.mjs
      - name: Commit if changed
        working-directory: blog
        run: |
          if git diff --quiet -- filed.json feed.xml; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add filed.json feed.xml
          git commit -m "Refresh Recently filed (automated)"
          git pull --rebase -q
          git push
