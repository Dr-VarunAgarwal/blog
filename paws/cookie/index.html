<!--
  COOKIE PAGE — lives at blog.varunagarwal.com/paws/cookie/, a sibling
  of the Vanilla gallery at /paws/. Same plain HTML/CSS/JS convention,
  same DATA-array-add-a-photo pattern (see ../index.html, wander/SETUP.md).

  She wasn't given a name — Varun remembers her by the cookie emoji,
  so that's the page title, not a name. She lived a short while
  (roughly May-Aug 2025, per the real photo timestamps); a couple of
  photos were added to the source album later (with an upload date,
  not a capture date) and are dated only "2025" here rather than
  guessing a false precision. No narrative/intro copy on this page by
  design — captions are short and factual, same restraint as /paws/.

  TO ADD A PHOTO:
  Drop the image into img/, then scroll to the DATA array below, copy
  an existing entry, paste it as a new line, give it the next id, and
  fill in img / caption / date. Save, commit. No redeploy step needed.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink: #1b2119;
    --paper: #f1e7d2;
    --paper-soft: #e6d9bd;
    --gold: #c29a4b;
    --caramel: #9c6b2e;
    --caramel-deep: #6f4a1c;
    --text-on-paper: #2a241c;
    --muted-on-paper: rgba(42,36,28,0.55);
    --max: 1080px;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--paper);
    color: var(--text-on-paper);
    font-family: "Space Mono", monospace;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }

  .wrap{ max-width: var(--max); margin: 0 auto; padding: 0 1.5rem; }

  header.site-header{
    padding: 1.1rem 1.5rem 0.9rem;
    border-bottom: 1px solid rgba(42,36,28,0.16);
  }
  header.site-header .wrap{ display: flex; justify-content: space-between; align-items: baseline; }
  .back-link{
    font-family: "Fraunces", serif; font-weight: 480;
    font-size: 1.15rem; letter-spacing: -0.01em;
    text-decoration: none; color: inherit;
  }
  .back-link .arrow{ color: var(--muted-on-paper); margin-right: 0.35rem; }
  @media(min-width:640px){
    header.site-header{ padding: 2.5rem 1.5rem 1.5rem; }
  }

  main{ padding: 1.75rem 0 3rem; }
  @media(min-width:640px){ main{ padding: 3.5rem 0 5rem; } }

  .hero{ max-width: 62ch; margin: 0 0 2.5rem; }
  h1.title{
    font-weight: 500;
    font-size: clamp(3rem, 12vw, 5rem); line-height: 1;
    margin: 0 0 0.9rem;
  }
  .hero .meta{
    font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--caramel);
  }

  .grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }
  @media(min-width:640px){
    .grid{ grid-template-columns: 1fr 1fr; gap: 1.75rem 1.5rem; }
  }
  @media(min-width:960px){
    .grid{ grid-template-columns: 1fr 1fr 1fr; }
  }

  figure.photo{
    margin: 0; break-inside: avoid;
  }
  figure.photo .frame{
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: var(--paper-soft);
    border: 1px solid rgba(42,36,28,0.1);
  }
  figure.photo img{
    display: block; width: 100%; height: auto;
  }
  figcaption{
    margin-top: 0.55rem;
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 0.75rem;
  }
  figcaption .cap{
    font-family: "Fraunces", serif; font-style: italic; font-weight: 480;
    font-size: 0.95rem; color: var(--text-on-paper);
  }
  figcaption .date{
    font-size: 0.62rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--muted-on-paper); white-space: nowrap;
  }

  footer{
    max-width: var(--max); margin: 2rem auto 0; padding: 1.25rem 1.5rem 1.5rem;
    color: var(--muted-on-paper); font-size: 0.7rem; letter-spacing: 0.04em;
    border-top: 1px solid rgba(42,36,28,0.14);
    text-align: center;
  }
  @media(min-width:640px){
    footer{ margin: 3rem auto 0; padding: 2rem 1.5rem 3.5rem; }
  }
  .footer-site{
    color: var(--text-on-paper); text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .footer-site:hover{ border-bottom-color: var(--caramel); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="back-link" href="https://blog.varunagarwal.com"><span class="arrow">←</span>lucidité</a>
    <a class="back-link" href="../">🐾</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="hero">
      <h1 class="title">🍪</h1>
      <span class="meta" id="photo-count"></span>
    </div>

    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>
  <a class="footer-site" href="https://varunagarwal.com">varunagarwal.com</a>
  <p style="margin:0.6rem 0 0;">lucidité, by Varun Agarwal</p>
</footer>

<script>
const DATA = [
  {id:1, img:'img/01-first-day.jpg', caption:'First day', date:'May 2025'},
  {id:2, img:'img/02-settling-in.jpg', caption:'Settling in', date:'Jul 2025'},
  {id:3, img:'img/03-held.jpg', caption:'Held', date:'Jul 2025'},
  {id:4, img:'img/04-wide-awake.jpg', caption:'Wide awake', date:'Jul 2025'},
  {id:5, img:'img/05-sprawled-out.jpg', caption:'Sprawled out', date:'Jul 2025'},
  {id:6, img:'img/06-hiding-spot.jpg', caption:'Hiding spot', date:'Jul 2025'},
  {id:7, img:'img/07-napping.jpg', caption:'Napping', date:'Aug 2025'},
  {id:8, img:'img/08-playing.jpg', caption:'Playing', date:'Aug 2025'},
  {id:9, img:'img/09-curled-up.jpg', caption:'Curled up', date:'2025'},
];

const grid = document.getElementById('grid');
grid.innerHTML = DATA.map(p => `
  <figure class="photo">
    <div class="frame">
      <img src="${p.img}" alt="${p.caption}" loading="lazy">
    </div>
    <figcaption>
      <span class="cap">${p.caption}</span>
      <span class="date">${p.date}</span>
    </figcaption>
  </figure>
`).join('');

document.getElementById('photo-count').textContent = DATA.length + ' photos';
</script>

</body>
</html>
