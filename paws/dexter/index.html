<!--
  DEXTER PAGE — lives at blog.varunagarwal.com/paws/dexter/, a sibling
  of /paws/vanilla/, /paws/cookie/ and /paws/scrappy/ under the /paws/
  family hub. Same plain HTML/CSS/JS convention, same
  DATA-array-add-a-photo pattern.

  Photos pulled from web/assess/1/ (a local raw dump alongside two
  unrelated .docx files, left untouched) — 37 photos found, 18 used,
  spanning real EXIF dates Oct 2018 - Apr 2019: puppy arrival through
  a full-grown dog a winter later. Coat/ear shape reads as an indie
  dog (desi mixed breed), not a specific pedigree, so tagged that way
  rather than guessing a breed. Accent `--rust` is inspired by (not
  pixel-sampled from) the red collar he wears through the whole run.
  Captions lean a little more playful than Vanilla/Scrappy's, per
  Varun's 2026-09-25 note that the Paws section overall could use
  more fun — still only describing what's actually in each frame,
  nothing invented.

  TO ADD A PHOTO:
  Drop the image into img/, then scroll to the DATA array below, copy
  an existing entry, paste it as a new line, give it the next id, and
  fill in img / caption / date. Save, commit. No redeploy step needed.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink: #1b2119;
    --paper: #f1e7d2;
    --paper-soft: #e6d9bd;
    --gold: #c29a4b;
    --rust: #a1402e;
    --rust-deep: #742c1f;
    --text-on-paper: #2a241c;
    --muted-on-paper: rgba(42,36,28,0.55);
    --max: 1080px;
  }
  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin: 0;
    background: var(--paper);
    color: var(--text-on-paper);
    font-family: "Space Mono", monospace;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }

  .wrap{ max-width: var(--max); margin: 0 auto; padding: 0 1.5rem; }

  header.site-header{
    padding: 1.1rem 1.5rem 0.9rem;
    border-bottom: 1px solid rgba(42,36,28,0.16);
  }
  header.site-header .wrap{ display: flex; justify-content: space-between; align-items: baseline; }
  .back-link{
    font-family: "Fraunces", serif; font-weight: 480;
    font-size: 1.15rem; letter-spacing: -0.01em;
    text-decoration: none; color: inherit;
  }
  .back-link .arrow{ color: var(--muted-on-paper); margin-right: 0.35rem; }
  .sibling-links{ display: flex; gap: 0.75rem; }
  @media(min-width:640px){
    header.site-header{ padding: 2.5rem 1.5rem 1.5rem; }
  }

  main{ padding: 1.75rem 0 3rem; }
  @media(min-width:640px){ main{ padding: 3.5rem 0 5rem; } }

  .hero{ max-width: 62ch; margin: 0 0 2.5rem; }
  h1.title{
    font-family: "Fraunces", serif; font-weight: 500; font-style: italic;
    font-size: clamp(3rem, 12vw, 5rem); line-height: 1;
    margin: 0 0 0.5rem; color: var(--rust);
  }
  .hero .tagline{
    font-family: "Fraunces", serif; font-style: italic; font-weight: 480;
    font-size: 1.05rem; color: var(--text-on-paper); margin: 0 0 0.6rem;
  }
  .hero .meta{
    font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--rust);
  }

  .grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }
  @media(min-width:640px){
    .grid{ grid-template-columns: 1fr 1fr; gap: 1.75rem 1.5rem; }
  }
  @media(min-width:960px){
    .grid{ grid-template-columns: 1fr 1fr 1fr; }
  }

  figure.photo{
    margin: 0; break-inside: avoid;
  }
  figure.photo .frame{
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    background: var(--paper-soft);
    border: 1px solid rgba(42,36,28,0.1);
  }
  figure.photo img{
    display: block; width: 100%; height: auto;
  }
  figcaption{
    margin-top: 0.55rem;
    display: flex; justify-content: space-between; align-items: baseline;
    gap: 0.75rem;
  }
  figcaption .cap{
    font-family: "Fraunces", serif; font-style: italic; font-weight: 480;
    font-size: 0.95rem; color: var(--text-on-paper);
  }
  figcaption .date{
    font-size: 0.62rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: var(--muted-on-paper); white-space: nowrap;
  }

  footer{
    max-width: var(--max); margin: 2rem auto 0; padding: 1.25rem 1.5rem 1.5rem;
    color: var(--muted-on-paper); font-size: 0.7rem; letter-spacing: 0.04em;
    border-top: 1px solid rgba(42,36,28,0.14);
    text-align: center;
  }
  @media(min-width:640px){
    footer{ margin: 3rem auto 0; padding: 2rem 1.5rem 3.5rem; }
  }
  .footer-site{
    color: var(--text-on-paper); text-decoration: none;
    border-bottom: 1px solid transparent;
  }
  .footer-site:hover{ border-bottom-color: var(--rust); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="back-link" href="../"><span class="arrow">←</span>paws</a>
    <div class="sibling-links">
      <a class="back-link" href="../vanilla/">🐕</a>
      <a class="back-link" href="../cookie/">🍪</a>
      <a class="back-link" href="../scrappy/">🦮</a>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="hero">
      <h1 class="title">Dexter.</h1>
      <p class="tagline">Arrived tiny. Left no shoe unchewed.</p>
      <span class="meta" id="photo-count"></span>
    </div>

    <div class="grid" id="grid"></div>
  </div>
</main>

<footer>
  <a class="footer-site" href="https://varunagarwal.com">varunagarwal.com</a>
  <p style="margin:0.6rem 0 0;">lucidité, by Varun Agarwal</p>
</footer>

<script>
const DATA = [
  {id:1, img:'img/01-first-box.jpg', caption:'Fresh out of the box', date:'Oct 2018'},
  {id:2, img:'img/02-shoe-thief.jpg', caption:'Shoe thief', date:'Oct 2018'},
  {id:3, img:'img/03-nibbling-the-bell.jpg', caption:'Chew toy: the collar', date:'Oct 2018'},
  {id:4, img:'img/04-paws-up.jpg', caption:'Paws up', date:'Oct 2018'},
  {id:5, img:'img/05-bargaining-for-a-biscuit.jpg', caption:'Bargaining for a biscuit', date:'Oct 2018'},
  {id:6, img:'img/06-in-good-hands.jpg', caption:'In good hands', date:'Nov 2018'},
  {id:7, img:'img/07-morning-lounging.jpg', caption:'Living his best life', date:'Nov 2018'},
  {id:8, img:'img/08-looking-up.jpg', caption:'Looking up', date:'Nov 2018'},
  {id:9, img:'img/09-on-the-dog-print-blanket.jpg', caption:'On the dog-print blanket', date:'Dec 2018'},
  {id:10, img:'img/10-standing-tall.jpg', caption:'Standing tall', date:'Dec 2018'},
  {id:11, img:'img/11-ball-time.jpg', caption:'Ball time', date:'Jan 2019'},
  {id:12, img:'img/12-lounging-in-a-jacket.jpg', caption:'Off duty, in a jacket', date:'Jan 2019'},
  {id:13, img:'img/13-morning-harness.jpg', caption:'Geared up', date:'Feb 2019'},
  {id:14, img:'img/14-barking-mad.jpg', caption:'Barking mad', date:'Mar 2019'},
  {id:15, img:'img/15-waiting.jpg', caption:'Very important business', date:'Mar 2019'},
  {id:16, img:'img/16-by-the-pond.jpg', caption:'By the pond', date:'Mar 2019'},
  {id:17, img:'img/17-against-the-sky.jpg', caption:'Golden hour, airborne', date:'Apr 2019'},
  {id:18, img:'img/18-all-grown-up.jpg', caption:'All grown up', date:'Apr 2019'},
];

const grid = document.getElementById('grid');
grid.innerHTML = DATA.map(p => `
  <figure class="photo">
    <div class="frame">
      <img src="${p.img}" alt="${p.caption}" loading="lazy">
    </div>
    <figcaption>
      <span class="cap">${p.caption}</span>
      <span class="date">${p.date}</span>
    </figcaption>
  </figure>
`).join('');

document.getElementById('photo-count').textContent = DATA.length + ' photos';
</script>

</body>
</html>
