<!--
  PAWS HUB — lives at blog.varunagarwal.com/paws/. Lists every pet as
  its own sibling gallery (vanilla/, cookie/, and eventually scrappy/,
  dexter/), same pattern as the main blog hub one level up listing
  books/wander/notes/paws. Plain HTML, no build step, no DATA array —
  short enough (a handful of pets) that a new entry is just a copy of
  an existing <a class="pet-card"> block, or a new <li> in the
  "Coming soon" list for one not built yet.

  TO ADD A LIVE PET:
  Copy an existing .pet-card block, point href/img at the new
  gallery, pick a --card-color not already used by a sibling card.

  TO ADD A "COMING SOON" PET:
  Add a new <li> to the .upcoming-items list.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,340;0,9..144,480;0,9..144,600;1,9..144,400;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink: #1b2119;
    --paper: #f1e7d2;
    --paper-soft: #e6d9bd;
    --gold: #c29a4b;
    --clay: #b5572e;
    --caramel: #9c6b2e;
    --text-on-paper: #2a241c;
    --muted-on-paper: rgba(42,36,28,0.55);
    --muted-on-dark: rgba(241,231,210,0.68);
    --max: 760px;
  }
  *{ box-sizing: border-box; }
  body{
    margin: 0;
    background: var(--paper);
    color: var(--text-on-paper);
    font-family: "Space Mono", monospace;
    -webkit-font-smoothing: antialiased;
  }
  a{ color: inherit; }

  .wrap{ max-width: var(--max); margin: 0 auto; padding: 0 1.5rem; }

  header.site-header{
    padding: 1.1rem 1.5rem 0.9rem;
    border-bottom: 1px solid rgba(42,36,28,0.16);
  }
  header.site-header .wrap{ display: flex; justify-content: space-between; align-items: baseline; }
  .back-link{
    font-family: "Fraunces", serif; font-weight: 480;
    font-size: 1.15rem; letter-spacing: -0.01em;
    text-decoration: none; color: inherit;
  }
  .back-link .arrow{ color: var(--muted-on-paper); margin-right: 0.35rem; }
  @media(min-width:640px){
    header.site-header{ padding: 2.5rem 1.5rem 1.5rem; }
  }

  main{ padding: 1.75rem 0 3rem; }
  @media(min-width:640px){ main{ padding: 3.5rem 0 5rem; } }

  .hero{ max-width: 62ch; margin: 0 0 2rem; }
  h1.title{
    font-family: "Fraunces", serif; font-weight: 500; font-style: italic;
    font-size: clamp(2.6rem, 9vw, 4.25rem); line-height: 1;
    margin: 0 0 0.9rem; color: var(--text-on-paper);
  }
  .hero p{
    font-size: 0.92rem; line-height: 1.7;
    color: var(--muted-on-paper); margin: 0;
  }

  .pets{
    display: flex; gap: 0.85rem; align-items: flex-start;
    overflow-x: auto; overscroll-behavior-x: contain;
    scroll-snap-type: x mandatory;
    margin: 0 -1.5rem; padding: 0 1.5rem 0.75rem;
  }
  @media(min-width:640px){
    .pets{
      display: grid; grid-template-columns: 1fr 1fr; align-items: start;
      overflow-x: visible; margin: 0; padding: 0;
    }
  }

  .pet-card{
    display: block; text-decoration: none; color: inherit;
    flex: 0 0 62%; scroll-snap-align: start;
    background: var(--card-color);
    border: 4px solid var(--card-color);
    border-radius: 8px;
    overflow: hidden;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  @media(min-width:640px){ .pet-card{ flex: initial; } }
  .pet-card--vanilla{ --card-color: var(--clay); }
  .pet-card--cookie{ --card-color: var(--caramel); }
  .pet-card:hover{
    transform: translateY(-3px);
    box-shadow: 5px 7px 0 0 rgba(27,33,25,0.22);
  }
  .pet-cover-wrap{ position: relative; line-height: 0; }
  .pet-cover{ width: 100%; height: auto; display: block; aspect-ratio: 4/5; object-fit: cover; }
  .pet-name{
    position: absolute; left: 0; right: 0; bottom: 0; margin: 0;
    padding: 0.6rem 1.1rem 0.75rem;
    background: var(--card-color);
    font-family: "Fraunces", serif; font-style: italic; font-weight: 500; font-size: 1.3rem;
    color: var(--paper); line-height: 1.15;
  }
  .pet-card:hover .pet-name{ color: var(--gold); }
  .pet-card-body{
    padding: 1rem 1.1rem 1.35rem;
    background: var(--card-color);
    color: var(--paper);
  }
  .pet-tag{
    font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--gold); display: block; margin-bottom: 0.6rem;
  }
  .pet-blurb{
    font-size: 0.76rem; line-height: 1.6; margin: 0;
    color: var(--muted-on-dark);
  }

  .upcoming-card{
    max-width: var(--max); margin: 1.5rem auto 0;
    padding: 0.85rem 1.1rem;
    border: 2px dashed rgba(42,36,28,0.28);
    border-radius: 8px;
  }
  @media(min-width:640px){ .upcoming-card{ padding: 1.1rem 1.35rem; } }
  .upcoming-tag{
    font-size: 0.62rem; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted-on-paper); display: block; margin-bottom: 0.7rem;
  }
  .upcoming-items{
    list-style: none; margin: 0; padding: 0;
    display: flex; flex-direction: column; gap: 0.7rem;
  }
  @media(min-width:640px){ .upcoming-items{ flex-direction: row; gap: 2rem; } }
  .upcoming-item{ display: flex; align-items: center; gap: 0.75rem; }
  .upcoming-item svg{ width: 22px; height: 22px; flex-shrink: 0; color: var(--muted-on-paper); }
  .upcoming-name{
    font-family: "Fraunces", serif; font-style: italic; font-weight: 500; font-size: 1.05rem;
    margin: 0; color: var(--text-on-paper);
  }

  footer{
    max-width: var(--max); margin: 2rem auto 0; padding: 1.25rem 1.5rem 1.5rem;
    color: var(--muted-on-paper); font-size: 0.7rem; letter-spacing: 0.04em;
    border-top: 1px solid rgba(42,36,28,0.14);
    text-align: center;
  }
  @media(min-width:640px){ footer{ margin: 3rem auto 0; padding: 2rem 1.5rem 3.5rem; } }
  .footer-site{ color: var(--text-on-paper); text-decoration: none; border-bottom: 1px solid transparent; }
  .footer-site:hover{ border-bottom-color: var(--clay); }
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="back-link" href="https://blog.varunagarwal.com"><span class="arrow">←</span>lucidité</a>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="hero">
      <h1 class="title">Paws.</h1>
      <p>The pets.</p>
    </div>
  </div>

  <div class="pets">
    <a class="pet-card pet-card--vanilla" href="vanilla/">
      <div class="pet-cover-wrap">
        <img class="pet-cover" src="vanilla/img/10-recent-closeup.jpg" alt="" loading="lazy">
        <p class="pet-name">Vanilluuu.</p>
      </div>
      <div class="pet-card-body">
        <span class="pet-tag">Golden retriever</span>
        <p class="pet-blurb">Since 2021, and still going.</p>
      </div>
    </a>
    <a class="pet-card pet-card--cookie" href="cookie/">
      <div class="pet-cover-wrap">
        <img class="pet-cover" src="cookie/img/04-wide-awake.jpg" alt="" loading="lazy">
        <p class="pet-name">🍪</p>
      </div>
      <div class="pet-card-body">
        <span class="pet-tag">Cat</span>
        <p class="pet-blurb">A short while, in 2025.</p>
      </div>
    </a>
  </div>

  <div class="wrap">
    <div class="upcoming-card">
      <span class="upcoming-tag">Coming soon</span>
      <ul class="upcoming-items">
        <li class="upcoming-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <ellipse cx="12" cy="16.5" rx="5" ry="4.2"/>
            <ellipse cx="5.5" cy="9" rx="2" ry="2.6"/>
            <ellipse cx="10" cy="5.5" rx="2" ry="2.6"/>
            <ellipse cx="15" cy="5.5" rx="2" ry="2.6"/>
            <ellipse cx="19.5" cy="9" rx="2" ry="2.6"/>
          </svg>
          <p class="upcoming-name">Scrappy</p>
        </li>
        <li class="upcoming-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
            <ellipse cx="12" cy="16.5" rx="5" ry="4.2"/>
            <ellipse cx="5.5" cy="9" rx="2" ry="2.6"/>
            <ellipse cx="10" cy="5.5" rx="2" ry="2.6"/>
            <ellipse cx="15" cy="5.5" rx="2" ry="2.6"/>
            <ellipse cx="19.5" cy="9" rx="2" ry="2.6"/>
          </svg>
          <p class="upcoming-name">Dexter</p>
        </li>
      </ul>
    </div>
  </div>
</main>

<footer>
  <a class="footer-site" href="https://varunagarwal.com">varunagarwal.com</a>
  <p style="margin:0.6rem 0 0;">lucidité, by Varun Agarwal</p>
</footer>

</body>
</html>
